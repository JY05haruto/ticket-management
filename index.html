<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101d32">
<meta name="description" content="鉄道風デザインの切符コレクション管理アプリ">
<link rel="manifest" href="./manifest.webmanifest">

<title>切符コレクション | Ticket Log</title>
<style>
:root{color-scheme:dark;--bg:#0b1423;--panel:#14243a;--panel2:#1a2e49;--line:#2a4260;--gold:#e8bd68;--ink:#f4f0e7;--muted:#a9b8c9;--red:#d97868}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -20%,#213b5b 0,transparent 55%),var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:1100px;margin:auto;padding:18px 16px 50px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding:8px 0 18px}.brand{display:flex;gap:12px;align-items:center}.logo{width:44px;height:44px;border:1px solid var(--gold);border-radius:8px;display:grid;place-items:center;color:var(--gold);font-size:24px}.eyebrow{font-size:10px;letter-spacing:.2em;color:var(--gold)}h1{font-size:20px;margin:2px 0}.top small{color:var(--muted)}.hero{padding:24px 0 18px}.hero h2{font-size:clamp(22px,5vw,34px);margin:0 0 6px}.hero p{color:var(--muted);margin:0}.home-recent{margin:18px 0 24px}.home-recent h2{font-size:17px;margin:0 0 12px}.home-recent h2 span{font-size:11px;color:var(--gold);font-weight:500;margin-left:6px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}.stat,.panel,.ticket{background:linear-gradient(145deg,var(--panel),#101d30);border:1px solid var(--line);border-radius:12px}.stat{padding:13px}.stat b{display:block;font-size:24px;color:var(--gold)}.stat span{font-size:12px;color:var(--muted)}.actions{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}.btn{border:1px solid var(--line);background:var(--panel2);color:var(--ink);padding:10px 14px;border-radius:8px}.btn.primary{background:var(--gold);border-color:var(--gold);color:#172235;font-weight:700}.btn.danger{border-color:#74463f;color:#ffb6a9}.btn:disabled{opacity:.5;cursor:not-allowed}.tabs{display:flex;gap:6px;overflow:auto;padding:4px 0 12px}.tab{white-space:nowrap;border:1px solid var(--line);border-radius:999px;padding:8px 13px;background:transparent;color:var(--muted)}.tab.active{background:var(--gold);color:#172235;border-color:var(--gold);font-weight:700}.panel{padding:16px;margin:12px 0}.panel h3{margin:0 0 14px;font-size:17px}.filters{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px}.field{display:flex;flex-direction:column;gap:5px;margin:9px 0}.hint{display:block;margin-top:5px;color:var(--muted);font-size:11px;line-height:1.5}.field label{font-size:12px;color:var(--muted)}input,select,textarea{width:100%;background:#0c1929;color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:11px;min-width:0}input[type=file]{padding:8px}textarea{min-height:75px;resize:vertical}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:12px}.ticket{padding:14px;position:relative;overflow:hidden}.ticket:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--gold)}.ticket h4{margin:0 0 8px;font-size:16px}.ticket .meta{font-size:12px;color:var(--muted);line-height:1.8}.pill{display:inline-block;border:1px solid #806b47;color:var(--gold);border-radius:4px;padding:2px 7px;font-size:11px;margin:0 4px 7px 0}.thumbs{display:flex;gap:6px;margin-top:10px;overflow:auto}.thumbs img{width:76px;height:60px;object-fit:cover;border-radius:5px;border:1px solid var(--line)}.no-photo{min-height:60px;align-items:center;justify-content:center;border:1px dashed var(--line);border-radius:5px;color:var(--muted);font-size:12px}.empty{text-align:center;color:var(--muted);padding:36px 10px}.hidden{display:none!important}.modal{position:fixed;inset:0;background:#050b14d9;display:grid;place-items:center;padding:14px;z-index:5;overflow:auto}.dialog{width:min(620px,calc(100vw - 32px));max-height:82vh;max-height:82dvh;overflow:auto;background:#122139;border:1px solid var(--gold);border-radius:14px;padding:18px}.dialog-head{display:flex;justify-content:space-between;align-items:center}.dialog-head h3{margin:0}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.wide{grid-column:1/-1}.notice{font-size:12px;color:var(--muted);line-height:1.7}.footer{margin-top:30px;padding-top:14px;border-top:1px solid var(--line);color:var(--muted);font-size:11px;text-align:center}/* Responsive layout for phones, tablets and landscape screens. */
html{width:100%;min-width:0;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{width:100%;min-width:0;overflow-x:hidden}
.app{width:100%;min-width:0;padding-left:clamp(10px,3vw,24px);padding-right:clamp(10px,3vw,24px);padding-bottom:max(28px,env(safe-area-inset-bottom))}
.top,.brand,.actions,.tabs
.top>*{min-width:0}
.grid{grid-template-columns:repeat(auto-fit,minmax(min(100%,235px),1fr))}
.filters,.formgrid{min-width:0}
.field,input,select,textarea,.ticket,.panel,.stat{min-width:0;max-width:100%}
.ticket,.panel{overflow-wrap:anywhere}
img{max-width:100%;height:auto}
@media(max-width:600px){
.app{padding-top:10px}
.top{align-items:flex-start}
.hero{padding:18px 0 14px}
.filters{grid-template-columns:repeat(2,minmax(0,1fr))}
.filters input{grid-column:1/-1}
.formgrid{grid-template-columns:minmax(0,1fr)}
.wide{grid-column:auto}
.stats{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.stat{padding:9px 7px}
.stat b{font-size:clamp(17px,5vw,21px)}
.stat span{font-size:clamp(10px,2.8vw,12px)}
.btn{padding:9px 11px}
.dialog{padding:14px}
}
@media(max-width:360px){
.filters{grid-template-columns:minmax(0,1fr)}
.filters input{grid-column:auto}
.stats{grid-template-columns:1fr}
.stat{display:flex;align-items:center;justify-content:space-between;gap:8px}
.stat b{margin:0}
h1{font-size:18px}
}
@media(min-width:601px) and (max-width:900px){
.formgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid{grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))}
}
@media(orientation:landscape) and (max-height:500px){
.hero{padding:12px 0}
.dialog{max-height:88vh}
}
.filters{grid-template-columns:1fr 1fr}.filters input{grid-column:1/-1}.formgrid{grid-template-columns:1fr}.wide{grid-column:auto}.app{padding:12px 12px 35px}.stats{gap:7px}.stat{padding:10px}.stat b{font-size:21px}}
/* Search controls stay on one row; safe-area padding keeps content clear of system bars. */
.filters{display:grid;grid-template-columns:minmax(0,2fr) auto minmax(0,1fr) minmax(0,1fr);gap:7px;align-items:center}
.filters input{grid-column:auto;min-width:0;padding:10px 8px}
.filters select{min-width:0;padding:10px 6px;font-size:13px}
.filters .btn{white-space:nowrap;padding:10px 11px}
@media(max-width:600px){.filters{grid-template-columns:minmax(0,2fr) auto minmax(0,1fr) minmax(0,1fr);gap:5px}.filters input{grid-column:auto;font-size:12px;padding:9px 6px}.filters select{font-size:11px;padding:9px 3px}.filters .btn{font-size:12px;padding:9px 7px}}
@media(max-width:360px){.filters{grid-template-columns:minmax(0,1.6fr) auto minmax(0,.9fr) minmax(0,.9fr)}.filters select{font-size:10px;padding-left:1px;padding-right:1px}.filters .btn{font-size:11px;padding-left:5px;padding-right:5px}}
html,body{min-height:100%;padding-top:env(safe-area-inset-top)}
.app{padding-bottom:max(35px,env(safe-area-inset-bottom))}

/* Search input above three equally sized controls. */
.filters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;align-items:center}
.filters input{grid-column:1/-1;min-width:0}
.filters .btn,.filters select{min-width:0;width:100%;height:42px;min-height:42px;padding:9px 6px;display:flex;align-items:center;justify-content:center;box-sizing:border-box}
@media(max-width:600px){.filters{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.filters input{grid-column:1/-1}.filters .btn,.filters select{height:42px;min-height:42px;padding:8px 4px;font-size:11px}}
@media(max-width:360px){.filters{grid-template-columns:repeat(3,minmax(0,1fr))}.filters .btn{font-size:11px;padding-left:3px;padding-right:3px}.filters select{font-size:10px;padding-left:2px;padding-right:2px}}


.company-field{position:relative}.company-suggestions{position:absolute;z-index:8;top:calc(100% - 24px);left:0;right:0;max-height:190px;overflow-y:auto;background:#0c1929;border:1px solid var(--gold);border-radius:8px;box-shadow:0 8px 20px #0009}.company-suggestions button{display:block;width:100%;padding:10px 12px;text-align:left;color:var(--ink);background:transparent;border:0;border-bottom:1px solid var(--line)}.company-suggestions button:last-child{border-bottom:0}.company-suggestions button:active{background:var(--panel2)}

.price-wrap{position:relative}.price-wrap input{padding-right:38px}.price-wrap #priceUnit{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:14px;pointer-events:none}

.photo-preview{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;margin-top:10px}.photo-preview-item{position:relative;min-width:0;background:#0c1929;border:1px solid var(--line);border-radius:7px;padding:5px}.photo-preview-item img{display:block;width:100%;height:100px;object-fit:contain;border-radius:4px}.photo-preview-item span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);font-size:10px;margin-top:4px}.photo-preview-empty{grid-column:1/-1;color:var(--muted);font-size:11px;padding:8px 0}

.route-grid{grid-template-columns:repeat(2,minmax(0,1fr))!important}
.route-grid>.field{min-width:0}
/* Keep title and close action in one sticky, aligned header row. */
.dialog-wrap{
  position:relative;
  width:min(620px,calc(100vw - 32px));
  max-width:100%;
  padding-top:0;
}
.dialog-wrap .dialog{width:100%;max-width:100%;position:relative}
.dialog-head{
  position:static;
  display:flex;
  align-items:center;
  justify-content:flex-start;
  min-height:0;
  background:transparent;
  padding:0;
  margin:0 0 12px;
}
.dialog-head h3{
  margin:0;
  font-size:20px;
  line-height:1.3;
  font-weight:700;
}
.dialog-close{display:none}
#modal #ticketForm{margin-top:0}
#modal #ticketForm input:not([type="hidden"]),
#modal #ticketForm select,
#modal #ticketForm textarea{
  border:1px solid var(--line)!important;
  border-radius:12px;
  outline:none!important;
  box-shadow:none!important;
}

/* Pin the app title and ticket icon to the top edge. */
.top{
  position:fixed;
  left:50%;
  top:0;
  transform:translateX(-50%);
  width:min(1100px,100%);
  z-index:4;
  padding:calc(4px + env(safe-area-inset-top)) 16px 4px;
  border-bottom:1px solid var(--line);
  border-top:0;
  background:rgba(11,20,35,.97);
  box-shadow:0 8px 24px rgba(0,0,0,.22);
  backdrop-filter:blur(10px);
}
.app{padding-top:calc(60px + env(safe-area-inset-top))!important}


/* Full-size ticket photo viewer */
.photo-lightbox{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:54px 14px 20px;background:rgba(0,0,0,.92)}
.photo-lightbox.open{display:flex}
.photo-lightbox img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;border-radius:6px}
.photo-lightbox-close{position:absolute;top:calc(10px + env(safe-area-inset-top));right:14px;width:42px;height:42px;border:1px solid #fff8;border-radius:50%;background:#172235;color:#fff;font-size:30px;line-height:1;display:grid;place-items:center;padding:0}
.photo-preview-item img,.thumbs img{cursor:zoom-in}
.photo-preview-item .photo-remove{display:block;width:100%;white-space:nowrap;word-break:keep-all;text-align:center;padding:7px 4px;font-size:12px;line-height:1.3;margin-top:5px}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="brand"><div class="logo">🎫</div><div><h1>切符コレクション</h1><small>MY TICKET ARCHIVE</small></div></div></header>
<div class="stats"><div class="stat"><b id="totalCount">0</b><span>登録した切符</span></div><div class="stat"><b id="companyCount">0</b><span>鉄道会社</span></div><div class="stat"><b id="countryCount">0</b><span>国・地域</span></div></div>


<div class="actions"><button class="btn primary" id="addBtn">＋ 切符を追加</button></div>
<section class="home-recent"><h2>最近追加した切符 <span>最新3件</span></h2><div id="recentTickets" class="grid"><div class="empty">まだ切符が登録されていません。</div></div></section>

<section class="panel"><h3 id="listHeading">切符一覧</h3><div class="filters"><input id="search" placeholder="会社・駅・国・メモなどで検索"><button class="btn primary" id="searchBtn" type="button">検索</button><select id="typeFilter"><option value="">すべての券種</option><option>乗車券</option><option>料金券</option><option>一葉券</option><option>指ノミ券</option><option>フリー切符</option></select><select id="sort"><option value="new">登録順</option><option value="date">利用日順</option><option value="price">金額順</option></select></div><small class="hint search-hint">※検索ボタンをもう一度押すと、検索条件がリセットされます。</small></section>
<div id="ticketList" class="grid"><div class="empty">まだ切符が登録されていません。<br>「切符を追加」からコレクションを作りましょう。</div></div>


</div>
<div id="modal" class="modal hidden"><div class="dialog-wrap"><div class="dialog"><div class="dialog-head"><h3 id="formTitle">切符を追加</h3></div><form id="ticketForm"><input type="hidden" id="ticketId"><div class="formgrid">
<div class="field"><label>国内・海外</label><select id="region"><option value="国内">国内</option><option value="海外">海外</option></select></div>
<div class="field"><label>券種</label><select id="type" required><option>乗車券</option><option>料金券</option><option>一葉券</option><option>指ノミ券</option><option>フリー切符</option></select></div>
<div class="field company-field"><label>鉄道会社</label><input id="company" required autocomplete="off" placeholder="入力または履歴から選択"><datalist id="companyHistory"></datalist><div id="companySuggestions" class="company-suggestions hidden"></div><small class="hint">※直通運転の場合は、発駅側の鉄道会社を入力してください。</small></div>
<div class="field wide"><label>区間1</label><div class="formgrid route-grid"><div class="field"><label>発駅</label><input id="route1From" placeholder=""></div><div class="field"><label>着駅</label><input id="route1To" placeholder=""></div></div></div>
<div class="field wide"><label>区間2（改札内乗り継ぎ)</label><div class="formgrid route-grid"><div class="field"><label>発駅</label><input id="route2From" placeholder=""></div><div class="field"><label>着駅</label><input id="route2To" placeholder=""></div></div><small class="hint">区間2を入力しない場合、切符の詳細には表示されません。</small></div>
<div class="field"><label>列車名</label><input id="trainName" placeholder="例：特急○○号"></div>
<div class="field"><label>席種</label><input id="seatType" placeholder="例：指定席・自由席・グリーン車"></div>
<div class="field wide hidden" id="segment2TrainFields"><label>区間2の列車情報</label><div class="formgrid"><div class="field"><label>2区間目の列車名</label><input id="trainName2" placeholder="例：特急○○号"></div><div class="field"><label>2区間目の席種</label><input id="seatType2" placeholder="例：指定席・自由席・グリーン車"></div></div></div>
<div class="field"><label>ネット予約</label><select id="reservationService"><option value="">該当なし</option><option>えきねっと</option><option>e5489</option><option>EX予約</option><option>JR九州ネット予約</option></select></div>
<div class="field"><label>発行箇所</label><input id="place" placeholder="実際に発券・受取した駅"></div>
<div class="field overseas-field hidden"><label>国・地域</label><input id="country" placeholder="例：台湾"></div>

<div class="field"><label>利用日</label><input id="date" type="date"></div>
<div class="field"><label>金額</label><input id="price" type="number" min="0" step="1" placeholder=""></div>
<div class="field wide"><label>メモ</label><textarea id="memo" placeholder=""></textarea></div>
<div class="field wide"><label>写真（表・裏・複数枚可）</label><div class="actions"><button class="btn" type="button" id="choosePhotosBtn">ファイルを選択</button><button class="btn" type="button" id="openCameraBtn">カメラを起動</button></div><input id="photos" class="hidden" type="file" accept="image/*" multiple><input id="cameraPhoto" class="hidden" type="file" accept="image/*" capture="environment"><small class="hint">端末内の写真を選ぶ場合は「ファイルを選択」、新しく撮影する場合は「カメラを起動」を押してください。</small><small id="photoSelectionInfo" class="hint">写真はまだ選択されていません。</small><div id="photoPreview" class="photo-preview" aria-live="polite"></div></div>

</div><div class="actions"><button class="btn primary" type="submit">保存する</button><button class="btn" type="button" id="cancelBtn">キャンセル</button></div></form></div>
</div>
<div id="photoLightbox" class="photo-lightbox" role="dialog" aria-modal="true" aria-label="写真の拡大表示"><button type="button" id="photoLightboxClose" class="photo-lightbox-close" aria-label="閉じる">×</button><img id="photoLightboxImage" alt="拡大表示した切符写真"></div>
<script>
const DB_NAME='ticket-log-db',STORE='tickets';let db,allTickets=[],activeTab='all',pendingPhotos=[],listSearched=false;
const $=id=>document.getElementById(id);
function openDB(){return new Promise((resolve,reject)=>{const req=indexedDB.open(DB_NAME,1);req.onupgradeneeded=()=>req.result.createObjectStore(STORE,{keyPath:'id'});req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
function dbPut(item){return new Promise((resolve,reject)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).put(item);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}
function dbGet(){return new Promise((resolve,reject)=>{const tx=db.transaction(STORE,'readonly'),r=tx.objectStore(STORE).getAll();r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
function dbDelete(id){return new Promise((resolve,reject)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).delete(id);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function kanaSort(a,b){return a.localeCompare(b,'ja')}
function photoSrc(p){try{return p.file&&window.AndroidPhotoStore?AndroidPhotoStore.getPhoto(p.file):(p.data||'')}catch(e){console.error('写真データの取得に失敗しました',e);return ''}}
function getRouteParts(t){let a=t.route1From||'',b=t.route1To||'',c=t.route2From||'',d=t.route2To||'';if(!a&&!b&&!c&&!d&&t.route){const parts=String(t.route).split(/\s*(?:→|->|－|〜|～)\s*/);a=parts[0]||'';b=parts[1]||''}return {a,b,c,d}}
function routeHeading(t){const r=getRouteParts(t);return [r.a&&r.b?r.a+' → '+r.b:'',r.c&&r.d?r.c+' → '+r.d:''].filter(Boolean).join(' ／ ')||t.company||'名称未設定'}
function routeDetails(t){const r=getRouteParts(t);return (r.a||r.b?'<br>区間1：'+esc(r.a||'未入力')+' → '+esc(r.b||'未入力'):'')+(r.d?'<br>区間2：'+esc(r.c||'未入力')+' → '+esc(r.d):'')}
function ticketCard(t){return '<article class="ticket"><span class="pill">'+esc(t.type)+'</span><span class="pill">'+esc(t.region)+'</span><h4>'+esc(routeHeading(t))+'</h4><div class="meta"><b>'+esc(t.company)+'</b>'+routeDetails(t)+'<br>ネット予約：'+esc(t.reservationService||'該当なし')+'<br>発行場所：'+esc(t.place||'未設定')+(t.region==='海外'?'<br>国・地域：'+esc(t.country||'未設定'):'')+'<br>列車名（区間1）：'+esc(t.trainName||'未設定')+'<br>席種（区間1）：'+esc(t.seatType||'未設定')+(getRouteParts(t).d?'<br>列車名（区間2）：'+esc(t.trainName2||'未設定')+'<br>席種（区間2）：'+esc(t.seatType2||'未設定'):'')+'<br>利用日：'+esc(t.date||'未設定')+'　金額：'+(t.price?Number(t.price).toLocaleString()+(t.region==='国内'?' 円':''):'未設定')+(t.memo?'<br>'+esc(t.memo):'')+'</div>'+(t.photos?.length?'<div class="thumbs">'+t.photos.map((p,i)=>'<img src="'+photoSrc(p)+'" alt="切符写真 '+(i+1)+'">').join('')+'</div>':'<div class="thumbs no-photo">画像未登録</div>')+'<div class="actions"><button class="btn" data-edit="'+t.id+'">編集</button><button class="btn danger" data-delete="'+t.id+'">削除</button></div></article>'}
function render(){const q=$('search').value.trim().toLowerCase(),selectedType=$('typeFilter').value.trim();let list=listSearched?allTickets.filter(t=>{const typeMatches=!selectedType||String(t.type||'').trim()===selectedType;const rp=getRouteParts(t);const textMatches=[t.company,t.reservationService,t.place,t.country,t.route,rp.a,rp.b,rp.c,rp.d,t.trainName,t.seatType,t.trainName2,t.seatType2,t.memo,t.type].join(' ').toLowerCase().includes(q);return typeMatches&&textMatches}):[];if($('sort').value==='date')list.sort((a,b)=>(b.date||'').localeCompare(a.date||''));if($('sort').value==='price')list.sort((a,b)=>(b.price||0)-(a.price||0));if($('sort').value==='new')list.sort((a,b)=>b.created-a.created);
$('totalCount').textContent=allTickets.length;$('companyCount').textContent=new Set(allTickets.map(t=>t.company).filter(Boolean)).size;$('countryCount').textContent=new Set(allTickets.filter(t=>t.region==='海外').map(t=>t.country).filter(Boolean)).size;
$('listHeading').textContent='切符一覧';
const recent=[...allTickets].sort((a,b)=>(b.created||0)-(a.created||0)).slice(0,3);$('recentTickets').innerHTML=recent.length?recent.map(ticketCard).join(''):'<div class="empty">まだ切符が登録されていません。</div>';
$('ticketList').innerHTML=!listSearched?'<div class="empty">検索すると切符が表示されます。</div>':list.length?list.map(ticketCard).join(''):'<div class="empty">該当する切符はありません。</div>';
}
function updateCompanyHistory(){const history=[...new Set(allTickets.map(x=>(x.company||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ja'));$('companyHistory').replaceChildren(...history.map(name=>{const option=document.createElement('option');option.value=name;return option}));return history}
function showCompanySuggestions(){const box=$('companySuggestions'),q=$('company').value.trim().toLowerCase(),history=updateCompanyHistory().filter(name=>name.toLowerCase().includes(q));box.replaceChildren();if(!history.length){box.classList.add('hidden');return}for(const name of history){const button=document.createElement('button');button.type='button';button.textContent=name;button.addEventListener('mousedown',e=>e.preventDefault());button.addEventListener('click',()=>{$('company').value=name;box.classList.add('hidden')});box.append(button)}box.classList.remove('hidden')}
function openForm(t){$('ticketForm').reset();pendingPhotos=[];updateCompanyHistory();$('ticketId').value=t?.id||'';$('formTitle').textContent=t?'切符を編集':'切符を追加';if(t){for(const k of ['region','type','company','reservationService','place','country','trainName','seatType','trainName2','seatType2','date','price','memo'])$(k).value=t[k]??'';const r=getRouteParts(t);$('route1From').value=r.a;$('route1To').value=r.b;$('route2From').value=r.c||r.b;$('route2To').value=r.d;pendingPhotos=t.photos||[]}toggleCountry();updatePhotoSelection();$('modal').classList.remove('hidden');requestAnimationFrame(()=>updatePhotoSelection());$('modal').scrollTop=0;document.querySelector('.dialog').scrollTop=0;window.scrollTo(0,0)}
function syncSegment2From(){ $('route2From').value=$('route1To').value; }$('route1To').addEventListener('input',()=>{syncSegment2From();toggleSegment2Fields()});function toggleSegment2Fields(){const active=!!$('route2To').value.trim();$('segment2TrainFields').classList.toggle('hidden',!active)}$('route2From').addEventListener('input',toggleSegment2Fields);$('route2To').addEventListener('input',toggleSegment2Fields);function toggleCountry(){document.querySelectorAll('.overseas-field').forEach(x=>x.classList.toggle('hidden',$('region').value!=='海外'))}function $$(s){return [...document.querySelectorAll(s)]}
let previewRenderId=0;
function selectedPhotoFiles(){return [...[...$('photos').files].map((file,index)=>({file,inputId:'photos',index})),...[...$('cameraPhoto').files].map((file,index)=>({file,inputId:'cameraPhoto',index}))]}
function updatePhotoSelection(){const files=selectedPhotoFiles(),count=pendingPhotos.length+files.length;$('photoSelectionInfo').textContent=count?count+'枚の写真を登録・選択中です。':'写真はまだ選択されていません。';renderPhotoPreview(files)}
async function renderPhotoPreview(files=[]){
 const renderId=++previewRenderId,box=$('photoPreview');box.replaceChildren();
 const entries=pendingPhotos.map((p,i)=>({src:photoSrc(p),name:p.name||('登録済み写真 '+(i+1)),kind:'saved',index:i}));
 for(const selected of files){
  try{const result=await fileData(selected.file);entries.push({src:result.data,name:selected.file.name||'選択した写真',kind:'file',inputId:selected.inputId,index:selected.index})}
  catch(error){entries.push({src:'',name:selected.file.name||'選択した写真',error:String(error?.message||error),kind:'file',inputId:selected.inputId,index:selected.index})}
 }
 if(renderId!==previewRenderId)return;
 if(!entries.length){const empty=document.createElement('div');empty.className='photo-preview-empty';empty.textContent='選択した画像のプレビューがここに表示されます。';box.append(empty);return}
 for(const entry of entries){
  const item=document.createElement('div');item.className='photo-preview-item';
  if(entry.src){const img=document.createElement('img');img.src=entry.src;img.alt='切符画像のプレビュー';img.onerror=()=>{img.remove();const error=document.createElement('span');error.textContent='画像を表示できません（画像形式または読み込みエラー）';item.prepend(error)};item.append(img)}
  else{const error=document.createElement('span');error.textContent=entry.error?'読み込み失敗：'+entry.error:'画像データを取得できません';item.append(error)}
  const label=document.createElement('span');label.textContent=entry.name;item.append(label);
  const remove=document.createElement('button');remove.type='button';remove.className='btn danger photo-remove';remove.textContent='写真を削除';remove.dataset.photoKind=entry.kind;remove.dataset.photoIndex=String(entry.index);if(entry.inputId)remove.dataset.photoInputId=entry.inputId;item.append(remove);box.append(item)
 }
}
function openPhotoLightbox(src){if(!src)return;$('photoLightboxImage').src=src;$('photoLightbox').classList.add('open')}
function closePhotoLightbox(){$('photoLightbox').classList.remove('open');$('photoLightboxImage').removeAttribute('src')}
$('photoLightboxClose').addEventListener('click',closePhotoLightbox);
$('photoLightbox').addEventListener('click',e=>{if(e.target===$('photoLightbox'))closePhotoLightbox()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closePhotoLightbox()});
document.addEventListener('click',e=>{const img=e.target.closest('.photo-preview-item img,.thumbs img');if(img&&!e.target.closest('[data-photo-kind]'))openPhotoLightbox(img.src)});
$('photoPreview').addEventListener('click',e=>{
 const button=e.target.closest('[data-photo-kind]');if(!button)return;
 const index=Number(button.dataset.photoIndex);
 if(button.dataset.photoKind==='saved'){pendingPhotos.splice(index,1)}
 else{
  const targetInput=$(button.dataset.photoInputId);
  const dt=new DataTransfer();[...targetInput.files].forEach((file,i)=>{if(i!==index)dt.items.add(file)});targetInput.files=dt.files;
 }
 updatePhotoSelection();
});
$('choosePhotosBtn').addEventListener('click',()=>$('photos').click());$('openCameraBtn').addEventListener('click',()=>$('cameraPhoto').click());$('photos').addEventListener('change',updatePhotoSelection);$('cameraPhoto').addEventListener('change',updatePhotoSelection);$('region').addEventListener('change',toggleCountry);$('company').addEventListener('focus',showCompanySuggestions);$('company').addEventListener('input',showCompanySuggestions);$('companySuggestions').addEventListener('mouseleave',()=>{});document.addEventListener('click',e=>{if(!e.target.closest('.company-field'))$('companySuggestions').classList.add('hidden')});
$('addBtn').onclick=()=>openForm();$('cancelBtn').onclick=()=>$('modal').classList.add('hidden');
$('ticketForm').onsubmit=async e=>{e.preventDefault();const id=$('ticketId').value||crypto.randomUUID(),old=allTickets.find(t=>t.id===id);const photos=[...pendingPhotos];for(const input of [$('photos'),$('cameraPhoto')])for(const f of input.files){const data=await fileData(f);photos.push({name:f.name,data})}if(window.AndroidPhotoStore){for(const p of photos){if(p.data){const saved=AndroidPhotoStore.savePhoto(p.data,p.name||'ticket.jpg');if(saved){p.file=saved;delete p.data}}}}const item={id,created:old?.created||Date.now(),region:$('region').value,type:$('type').value,company:$('company').value.trim(),reservationService:$('reservationService').value,place:$('place').value.trim(),country:$('country').value.trim(),route1From:$('route1From').value.trim(),route1To:$('route1To').value.trim(),route2From:$('route2From').value.trim(),route2To:$('route2To').value.trim(),trainName:$('trainName').value.trim(),seatType:$('seatType').value.trim(),trainName2:$('trainName2').value.trim(),seatType2:$('seatType2').value.trim(),date:$('date').value,price:Number($('price').value)||0,memo:$('memo').value.trim(),photos};await dbPut(item);if(window.AndroidPhotoStore){const keep=new Set(photos.map(p=>p.file).filter(Boolean));for(const p of (old?.photos||[]))if(p.file&&!keep.has(p.file))AndroidPhotoStore.deletePhoto(p.file)}$('modal').classList.add('hidden');await refresh()};
function fileData(f){return new Promise((resolve,reject)=>{if(!f){reject(new Error('ファイルが取得できません'));return}const r=new FileReader();r.onload=()=>{if(typeof r.result!=='string'||!r.result.startsWith('data:image/')){reject(new Error('画像データではありません'));return}resolve({name:f.name||'ticket-image',data:r.result})};r.onerror=()=>reject(r.error||new Error('ファイル読み込みに失敗しました'));r.onabort=()=>reject(new Error('読み込みが中断されました'));try{r.readAsDataURL(f)}catch(e){reject(e)}})}
$('recentTickets').onclick=$('ticketList').onclick=async e=>{const edit=e.target.closest('[data-edit]'),del=e.target.closest('[data-delete]');if(edit){const t=allTickets.find(x=>x.id===edit.dataset.edit);openForm(t)}if(del&&confirm('この切符を削除しますか？')){const target=allTickets.find(x=>x.id===del.dataset.delete);if(target&&window.AndroidPhotoStore)for(const p of (target.photos||[]))if(p.file)AndroidPhotoStore.deletePhoto(p.file);await dbDelete(del.dataset.delete);await refresh()}};

function resetSearch(){listSearched=false;$('search').value='';$('typeFilter').value='';$('sort').value='new';render()}function runSearch(){if(listSearched){resetSearch();return}listSearched=true;render()}$('searchBtn').onclick=runSearch;$('search').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();runSearch()}};$('typeFilter').onchange=()=>{if(listSearched)render()};$('sort').onchange=()=>{if(listSearched)render()};
async function refresh(){allTickets=await dbGet();if(window.AndroidPhotoStore){for(const t of allTickets){let changed=false;for(const p of (t.photos||[])){if(p.data){const saved=AndroidPhotoStore.savePhoto(p.data,p.name||'ticket.jpg');if(saved){p.file=saved;delete p.data;changed=true}}}if(changed)await dbPut(t)}}render()}
(async()=>{try{db=await openDB();await refresh()}catch(e){alert('このブラウザでは端末内保存を利用できません。最新のChrome等で開いてください。')}})();
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
</body></html>
