<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101d32">
<meta name="description" content="鉄道風デザインの切符コレクション管理アプリ">
<link rel="manifest" href="./manifest.webmanifest">
<title>切符コレクション | Ticket Log</title>
<style>
:root{color-scheme:dark;--bg:#0b1423;--panel:#14243a;--panel2:#1a2e49;--line:#2a4260;--gold:#e8bd68;--ink:#f4f0e7;--muted:#a9b8c9;--red:#d97868}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -20%,#213b5b 0,transparent 55%),var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:1100px;margin:auto;padding:18px 16px 50px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding:8px 0 18px}.brand{display:flex;gap:12px;align-items:center}.logo{width:44px;height:44px;border:1px solid var(--gold);border-radius:8px;display:grid;place-items:center;color:var(--gold);font-size:24px}.eyebrow{font-size:10px;letter-spacing:.2em;color:var(--gold)}h1{font-size:20px;margin:2px 0}.top small{color:var(--muted)}.hero{padding:24px 0 18px}.hero h2{font-size:clamp(22px,5vw,34px);margin:0 0 6px}.hero p{color:var(--muted);margin:0}.home-recent{margin:18px 0 24px}.home-recent h2{font-size:17px;margin:0 0 12px}.home-recent h2 span{font-size:11px;color:var(--gold);font-weight:500;margin-left:6px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}.stat,.panel,.ticket{background:linear-gradient(145deg,var(--panel),#101d30);border:1px solid var(--line);border-radius:12px}.stat{padding:13px}.stat b{display:block;font-size:24px;color:var(--gold)}.stat span{font-size:12px;color:var(--muted)}.actions{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}.btn{border:1px solid var(--line);background:var(--panel2);color:var(--ink);padding:10px 14px;border-radius:8px}.btn.primary{background:var(--gold);border-color:var(--gold);color:#172235;font-weight:700}.btn.danger{border-color:#74463f;color:#ffb6a9}.btn:disabled{opacity:.5;cursor:not-allowed}.tabs{display:flex;gap:6px;overflow:auto;padding:4px 0 12px}.tab{white-space:nowrap;border:1px solid var(--line);border-radius:999px;padding:8px 13px;background:transparent;color:var(--muted)}.tab.active{background:var(--gold);color:#172235;border-color:var(--gold);font-weight:700}.panel{padding:16px;margin:12px 0}.panel h3{margin:0 0 14px;font-size:17px}.filters{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px}.field{display:flex;flex-direction:column;gap:5px;margin:9px 0}.hint{display:block;margin-top:5px;color:var(--muted);font-size:11px;line-height:1.5}.field label{font-size:12px;color:var(--muted)}input,select,textarea{width:100%;background:#0c1929;color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:11px;min-width:0}input[type=file]{padding:8px}textarea{min-height:75px;resize:vertical}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:12px}.ticket{padding:14px;position:relative;overflow:hidden}.ticket:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--gold)}.ticket h4{margin:0 0 8px;font-size:16px}.ticket .meta{font-size:12px;color:var(--muted);line-height:1.8}.pill{display:inline-block;border:1px solid #806b47;color:var(--gold);border-radius:4px;padding:2px 7px;font-size:11px;margin:0 4px 7px 0}.thumbs{display:flex;gap:6px;margin-top:10px;overflow:auto}.thumbs img{width:76px;height:60px;object-fit:cover;border-radius:5px;border:1px solid var(--line)}.no-photo{min-height:60px;align-items:center;justify-content:center;border:1px dashed var(--line);border-radius:5px;color:var(--muted);font-size:12px}.empty{text-align:center;color:var(--muted);padding:36px 10px}.hidden{display:none!important}.modal{position:fixed;inset:0;background:#050b14d9;display:grid;place-items:center;padding:14px;z-index:5;overflow:auto}.dialog{width:min(680px,100%);max-height:95vh;overflow:auto;background:#122139;border:1px solid var(--gold);border-radius:14px;padding:18px}.dialog-head{display:flex;justify-content:space-between;align-items:center}.dialog-head h3{margin:0}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.wide{grid-column:1/-1}.notice{font-size:12px;color:var(--muted);line-height:1.7}.footer{margin-top:30px;padding-top:14px;border-top:1px solid var(--line);color:var(--muted);font-size:11px;text-align:center}/* Responsive layout for phones, tablets and landscape screens. */
html{width:100%;min-width:0;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{width:100%;min-width:0;overflow-x:hidden}
.app{width:100%;min-width:0;padding-left:clamp(10px,3vw,24px);padding-right:clamp(10px,3vw,24px);padding-bottom:max(28px,env(safe-area-inset-bottom))}
.top,.brand,.actions,.tabs
.top>*{min-width:0}
.grid{grid-template-columns:repeat(auto-fit,minmax(min(100%,235px),1fr))}
.filters,.formgrid{min-width:0}
.field,input,select,textarea,.ticket,.panel,.stat{min-width:0;max-width:100%}
.ticket,.panel{overflow-wrap:anywhere}
img{max-width:100%;height:auto}
@media(max-width:600px){
.app{padding-top:10px}
.top{align-items:flex-start}
.hero{padding:18px 0 14px}
.filters{grid-template-columns:repeat(2,minmax(0,1fr))}
.filters input{grid-column:1/-1}
.formgrid{grid-template-columns:minmax(0,1fr)}
.wide{grid-column:auto}
.stats{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.stat{padding:9px 7px}
.stat b{font-size:clamp(17px,5vw,21px)}
.stat span{font-size:clamp(10px,2.8vw,12px)}
.btn{padding:9px 11px}
.dialog{padding:14px}
}
@media(max-width:360px){
.filters{grid-template-columns:minmax(0,1fr)}
.filters input{grid-column:auto}
.stats{grid-template-columns:1fr}
.stat{display:flex;align-items:center;justify-content:space-between;gap:8px}
.stat b{margin:0}
h1{font-size:18px}
}
@media(min-width:601px) and (max-width:900px){
.formgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid{grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))}
}
@media(orientation:landscape) and (max-height:500px){
.hero{padding:12px 0}
.dialog{max-height:88vh}
}
.filters{grid-template-columns:1fr 1fr}.filters input{grid-column:1/-1}.formgrid{grid-template-columns:1fr}.wide{grid-column:auto}.app{padding:12px 12px 35px}.stats{gap:7px}.stat{padding:10px}.stat b{font-size:21px}}
/* Search controls stay on one row; safe-area padding keeps content clear of system bars. */
.filters{display:grid;grid-template-columns:minmax(0,2fr) auto minmax(0,1fr) minmax(0,1fr);gap:7px;align-items:center}
.filters input{grid-column:auto;min-width:0;padding:10px 8px}
.filters select{min-width:0;padding:10px 6px;font-size:13px}
.filters .btn{white-space:nowrap;padding:10px 11px}
@media(max-width:600px){.filters{grid-template-columns:minmax(0,2fr) auto minmax(0,1fr) minmax(0,1fr);gap:5px}.filters input{grid-column:auto;font-size:12px;padding:9px 6px}.filters select{font-size:11px;padding:9px 3px}.filters .btn{font-size:12px;padding:9px 7px}}
@media(max-width:360px){.filters{grid-template-columns:minmax(0,1.6fr) auto minmax(0,.9fr) minmax(0,.9fr)}.filters select{font-size:10px;padding-left:1px;padding-right:1px}.filters .btn{font-size:11px;padding-left:5px;padding-right:5px}}
html,body{min-height:100%;padding-top:env(safe-area-inset-top)}
.app{padding-bottom:max(35px,env(safe-area-inset-bottom))}

/* Put search input on its own row, with search/type/sort controls below it. */
.filters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;align-items:center}
.filters input{grid-column:1/-1;min-width:0}
.filters .btn,.filters select{min-width:0;width:100%}
@media(max-width:600px){.filters{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.filters input{grid-column:1/-1}.filters .btn{padding:9px 6px;font-size:12px}.filters select{padding:9px 4px;font-size:11px}}
@media(max-width:360px){.filters{grid-template-columns:repeat(3,minmax(0,1fr))}.filters .btn{font-size:11px;padding-left:3px;padding-right:3px}.filters select{font-size:10px;padding-left:2px;padding-right:2px}}

</style>
</head>
<body>
<div class="app">
<header class="top"><div class="brand"><div class="logo">🎫</div><div><h1>切符コレクション</h1><small>MY TICKET ARCHIVE</small></div></div></header>
<div class="stats"><div class="stat"><b id="totalCount">0</b><span>登録した切符</span></div><div class="stat"><b id="companyCount">0</b><span>鉄道会社</span></div><div class="stat"><b id="countryCount">0</b><span>国・地域</span></div></div>


<div class="actions"><button class="btn primary" id="addBtn">＋ 切符を追加</button></div>
<section class="home-recent"><h2>最近追加した切符 <span>最新3件</span></h2><div id="recentTickets" class="grid"><div class="empty">まだ切符が登録されていません。</div></div></section>

<section class="panel"><h3 id="listHeading">切符一覧</h3><div class="filters"><input id="search" placeholder="会社・駅・国・メモなどで検索"><button class="btn primary" id="searchBtn" type="button">検索</button><select id="typeFilter"><option value="">すべての種類</option><option>乗車券</option><option>料金券</option><option>一葉券</option><option>指ノミ券</option><option>フリー切符</option></select><select id="sort"><option value="new">登録順</option><option value="date">利用日順</option><option value="price">金額順</option></select></div></section>
<div id="ticketList" class="grid"><div class="empty">まだ切符が登録されていません。<br>「切符を追加」からコレクションを作りましょう。</div></div>


</div>
<div id="modal" class="modal hidden"><div class="dialog"><div class="dialog-head"><h3 id="formTitle">切符を追加</h3><button class="btn" id="closeModal">閉じる</button></div><form id="ticketForm"><input type="hidden" id="ticketId"><div class="formgrid">
<div class="field"><label>国内・海外</label><select id="region"><option value="国内">国内</option><option value="海外">海外</option></select></div>
<div class="field"><label>切符の種類</label><select id="type" required><option>乗車券</option><option>料金券</option><option>一葉券</option><option>指ノミ券</option><option>フリー切符</option></select></div>
<div class="field"><label>鉄道会社</label><input id="company" required list="companyHistory" placeholder="入力または履歴から選択"><datalist id="companyHistory"></datalist><small class="hint">※直通運転の場合は、発駅側の鉄道会社を入力してください。</small></div>
<div class="field"><label>区間</label><input id="route" placeholder="例：横浜 → 海老名"></div>
<div class="field"><label>列車名</label><input id="trainName" placeholder="例：特急○○号"></div>
<div class="field"><label>席種</label><input id="seatType" placeholder="例：指定席・自由席・グリーン車"></div>
<div class="field"><label>ネット予約</label><select id="reservationService"><option value="">該当なし</option><option>えきねっと</option><option>e5489</option><option>EX予約</option><option>JR九州ネット予約</option></select></div>
<div class="field"><label>発行箇所</label><input id="place" placeholder="実際に発券・受取した駅"></div>
<div class="field overseas-field hidden"><label>国・地域</label><input id="country" placeholder="例：台湾"></div>

<div class="field"><label>利用日</label><input id="date" type="date"></div>
<div class="field"><label>金額（円換算可）</label><input id="price" type="number" min="0" step="1" placeholder="例：480"></div>
<div class="field wide"><label>メモ</label><textarea id="memo" placeholder="購入場所、思い出、補足など"></textarea></div>
<div class="field wide"><label>切符の写真（表・裏・複数枚可）</label><input id="photos" type="file" accept="image/*" multiple></div>

</div><div class="actions"><button class="btn primary" type="submit">保存する</button><button class="btn" type="button" id="cancelBtn">キャンセル</button></div></form></div>
</div>
<script>
const DB_NAME='ticket-log-db',STORE='tickets';let db,allTickets=[],activeTab='all',pendingPhotos=[],listSearched=false;
const $=id=>document.getElementById(id);
function openDB(){return new Promise((resolve,reject)=>{const req=indexedDB.open(DB_NAME,1);req.onupgradeneeded=()=>req.result.createObjectStore(STORE,{keyPath:'id'});req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
function dbPut(item){return new Promise((resolve,reject)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).put(item);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}
function dbGet(){return new Promise((resolve,reject)=>{const tx=db.transaction(STORE,'readonly'),r=tx.objectStore(STORE).getAll();r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
function dbDelete(id){return new Promise((resolve,reject)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).delete(id);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function kanaSort(a,b){return a.localeCompare(b,'ja')}
function photoSrc(p){return p.file&&window.AndroidPhotoStore?AndroidPhotoStore.getPhoto(p.file):(p.data||'')}
function ticketCard(t){return '<article class="ticket"><span class="pill">'+esc(t.type)+'</span><span class="pill">'+esc(t.region)+'</span><h4>'+esc(t.route||t.company||'名称未設定')+'</h4><div class="meta"><b>'+esc(t.company)+'</b><br>ネット予約：'+esc(t.reservationService||'該当なし')+'<br>発行場所：'+esc(t.place||'未設定')+(t.region==='海外'?'<br>国・地域：'+esc(t.country||'未設定'):'')+'<br>列車名：'+esc(t.trainName||'未設定')+'<br>席種：'+esc(t.seatType||'未設定')+'<br>利用日：'+esc(t.date||'未設定')+'　金額：'+(t.price?Number(t.price).toLocaleString()+' 円':'未設定')+(t.memo?'<br>'+esc(t.memo):'')+'</div>'+(t.photos?.length?'<div class="thumbs">'+t.photos.map((p,i)=>'<img src="'+photoSrc(p)+'" alt="切符写真 '+(i+1)+'">').join('')+'</div>':'<div class="thumbs no-photo">画像未登録</div>')+'<div class="actions"><button class="btn" data-edit="'+t.id+'">編集</button><button class="btn danger" data-delete="'+t.id+'">削除</button></div></article>'}
function render(){const q=$('search').value.trim().toLowerCase(),tf=$('typeFilter').value;let list=listSearched?allTickets.filter(t=>(!tf||t.type===tf)&&[t.company,t.reservationService,t.place,t.country,t.route,t.trainName,t.seatType,t.memo,t.type].join(' ').toLowerCase().includes(q)):[];if($('sort').value==='date')list.sort((a,b)=>(b.date||'').localeCompare(a.date||''));if($('sort').value==='price')list.sort((a,b)=>(b.price||0)-(a.price||0));if($('sort').value==='new')list.sort((a,b)=>b.created-a.created);
$('totalCount').textContent=allTickets.length;$('companyCount').textContent=new Set(allTickets.map(t=>t.company).filter(Boolean)).size;$('countryCount').textContent=new Set(allTickets.filter(t=>t.region==='海外').map(t=>t.country).filter(Boolean)).size;
$('listHeading').textContent='切符一覧';
const recent=[...allTickets].sort((a,b)=>(b.created||0)-(a.created||0)).slice(0,3);$('recentTickets').innerHTML=recent.length?recent.map(ticketCard).join(''):'<div class="empty">まだ切符が登録されていません。</div>';
$('ticketList').innerHTML=!listSearched?'<div class="empty">検索すると切符が表示されます。</div>':list.length?list.map(ticketCard).join(''):'<div class="empty">該当する切符はありません。</div>';
}
function updateCompanyHistory(){const history=[...new Set(allTickets.map(x=>(x.company||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ja'));$('companyHistory').replaceChildren(...history.map(name=>{const option=document.createElement('option');option.value=name;return option}))}
function openForm(t){$('ticketForm').reset();pendingPhotos=[];updateCompanyHistory();$('ticketId').value=t?.id||'';$('formTitle').textContent=t?'切符を編集':'切符を追加';if(t){for(const k of ['region','type','company','reservationService','place','country','route','trainName','seatType','date','price','memo'])$(k).value=t[k]??'';pendingPhotos=t.photos||[]}toggleCountry();$('modal').classList.remove('hidden')}
function toggleCountry(){$$('.overseas-field').forEach(x=>x.classList.toggle('hidden',$('region').value!=='海外'))}function $$(s){return [...document.querySelectorAll(s)]}
$('region').addEventListener('change',toggleCountry);
$('addBtn').onclick=()=>openForm();$('closeModal').onclick=$('cancelBtn').onclick=()=>$('modal').classList.add('hidden');
$('ticketForm').onsubmit=async e=>{e.preventDefault();const id=$('ticketId').value||crypto.randomUUID(),old=allTickets.find(t=>t.id===id);const photos=[...pendingPhotos];for(const f of $('photos').files){const data=await fileData(f);photos.push({name:f.name,data})}if(window.AndroidPhotoStore){for(const p of photos){if(p.data){const saved=AndroidPhotoStore.savePhoto(p.data,p.name||'ticket.jpg');if(saved){p.file=saved;delete p.data}}}}const item={id,created:old?.created||Date.now(),region:$('region').value,type:$('type').value,company:$('company').value.trim(),reservationService:$('reservationService').value,place:$('place').value.trim(),country:$('country').value.trim(),route:$('route').value.trim(),trainName:$('trainName').value.trim(),seatType:$('seatType').value.trim(),date:$('date').value,price:Number($('price').value)||0,memo:$('memo').value.trim(),photos};await dbPut(item);$('modal').classList.add('hidden');await refresh()};
function fileData(f){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve({name:f.name,data:r.result});r.onerror=reject;r.readAsDataURL(f)})}
$('recentTickets').onclick=$('ticketList').onclick=async e=>{const edit=e.target.closest('[data-edit]'),del=e.target.closest('[data-delete]');if(edit){const t=allTickets.find(x=>x.id===edit.dataset.edit);openForm(t)}if(del&&confirm('この切符を削除しますか？')){const target=allTickets.find(x=>x.id===del.dataset.delete);if(target&&window.AndroidPhotoStore)for(const p of (target.photos||[]))if(p.file)AndroidPhotoStore.deletePhoto(p.file);await dbDelete(del.dataset.delete);await refresh()}};

function resetSearch(){listSearched=false;$('search').value='';$('typeFilter').value='';$('sort').value='new';render()}function runSearch(){if(listSearched){resetSearch();return}const q=$('search').value.trim();if(!q){resetSearch();return}listSearched=true;render()}$('searchBtn').onclick=runSearch;$('company').addEventListener('focus',updateCompanyHistory);$('search').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();runSearch()}};$('typeFilter').onchange=()=>{if(listSearched)render()};$('sort').onchange=()=>{if(listSearched)render()};
async function refresh(){allTickets=await dbGet();if(window.AndroidPhotoStore){for(const t of allTickets){let changed=false;for(const p of (t.photos||[])){if(p.data){const saved=AndroidPhotoStore.savePhoto(p.data,p.name||'ticket.jpg');if(saved){p.file=saved;delete p.data;changed=true}}}if(changed)await dbPut(t)}}render()}
(async()=>{try{db=await openDB();await refresh()}catch(e){alert('このブラウザでは端末内保存を利用できません。最新のChrome等で開いてください。')}})();
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
</body></html>
